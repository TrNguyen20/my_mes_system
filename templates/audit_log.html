<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Nhật ký hệ thống | MES</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="/">🏠 Quay lại Dashboard</a>
        <span class="navbar-text text-warning fw-bold">NHẬT KÝ HÀNH ĐỘNG (AUDIT LOG)</span>
    </div>
</nav>

<div class="container">
    <div class="card shadow-sm border-0">
        <div class="card-body">
            <table class="table table-striped">
                <thead class="table-dark">
                    <tr>
                        <th>Thời gian</th>
                        <th>Người thực hiện</th>
                        <th>Hành động</th>
                        <th>Đối tượng</th>
                        <th>Chi tiết</th>
                    </tr>
                </thead>
                <tbody>
                    {% for log in logs %}
                    <tr>
                        <td>{{ log.timestamp.strftime('%d/%m/%Y %H:%M:%S') }}</td>
                        <td><span class="badge bg-info text-dark">{{ log.user.username }}</span></td>
                        <td><span class="fw-bold">{{ log.action }}</span></td>
                        <td>{{ log.target_type }} (ID: {{ log.target_id }})</td>
                        <td><small>{{ log.detail }}</small></td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
